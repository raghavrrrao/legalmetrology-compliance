# Continuous integration.
#
# Runs the same commands the README tells a developer to run locally. If CI
# ever needs a command that is not in the README, one of the two is wrong.
#
# Deliberately minimal: four jobs, no matrix across Python/Node versions, no
# caching beyond what setup-python and setup-node provide for free, and no
# deployment - this workflow proves the image is deployable and stops there.
# A six-person hackathon team needs "did I break main?" answered in a few
# minutes, not a build system to maintain.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the previous run for that PR. Without this, a
# branch pushed three times in a minute occupies three runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for an ephemeral container that exists only
          # for this job and is never reachable from outside the runner. These
          # are not secrets and must not be copied into any real environment.
          POSTGRES_DB: legalmetrology_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails
        # intermittently, which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-used-outside-this-runner
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: legalmetrology_ci
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the minimum in README.md. Bump both together.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -e ./ml

      - name: Django system checks
        run: python backend/manage.py check

      # Catches a model changed without its migration - the single most common
      # way this project's main branch would break for everyone at once.
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python backend/manage.py migrate

      # MUST run before load_rules. Rule files name the categories they apply
      # to by `ProductCategory.code`, and the loader rejects a code that has no
      # row rather than silently widening the rule to every commodity. On a
      # fresh database no categories exist, so load_rules fails with
      # "unknown product category code(s)".
      #
      # This step was not needed while rules/definitions/ was empty - the
      # loader never resolved a category - which is why its absence only
      # surfaced when the first real rules landed. The ordering is pinned by
      # apps/rules/tests/test_setup_sequence.py so it cannot silently regress.
      - name: Seed product categories
        run: python backend/manage.py seed_categories

      - name: Rule loader runs
        run: python backend/manage.py load_rules --dry-run

      # The other half of the setup, and it is not optional. Without the legal
      # framework a database has executable rules but no clauses, no source
      # citations and no applicability conditions - and the verdicts differ,
      # because a clause gated on an undeclared fact has no gate to check and
      # records a violation instead of asking for review. Runs for real rather
      # than --dry-run so the shipped framework files are actually written
      # against a clean database, which is what the README tells a developer to
      # do. Order is pinned by apps/rules/tests/test_setup_sequence.py.
      - name: Legal framework loader runs
        run: python backend/manage.py load_legal_framework

      # The single command a deployment runs. It re-runs all four of the steps
      # above, which is the point: it must be idempotent, because it runs on
      # every deploy and not only the first. It also verifies the resulting
      # state and exits non-zero if anything is empty - so if the framework
      # loader above ever silently stopped loading, this fails here rather than
      # producing different verdicts in a deployment.
      - name: Deployment setup command is idempotent
        run: python backend/manage.py deploy_setup

      # Static files are collected before the tests rather than after, because
      # WhiteNoise warns on every request when STATIC_ROOT does not exist and
      # 170 warnings is where a real one goes to hide. It also verifies that
      # collectstatic works under the production storage backend, which the
      # container build depends on.
      - name: Collect static files
        env:
          DJANGO_DEBUG: "False"
        run: python backend/manage.py collectstatic --noinput --clear

      # Django's own deployment audit: DEBUG, secret key, cookie flags, HSTS,
      # SSL redirect, allowed hosts. Runs with DEBUG=False because half of
      # these checks are no-ops otherwise.
      - name: Deployment checks
        env:
          DJANGO_DEBUG: "False"
        run: python backend/manage.py check --deploy

      - name: Backend tests
        working-directory: backend
        run: pytest -q

  ml:
    name: ML contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No database, no Django. This job passing while `backend` fails proves
      # the ML boundary is intact - which is the point of the separate package.
      #
      # Two installs, in two steps, because the difference is the point:
      # `labelextract` must remain installable and importable with no
      # dependencies at all, and the whole suite must pass that way. The `[ocr]`
      # extra is added afterwards so the preprocessing tests - which need Pillow
      # - actually run rather than silently skipping.
      #
      # The Tesseract *binary* is deliberately not installed. Every test uses an
      # injected fake runner; the one real smoke test skips when the binary is
      # absent, and it should keep skipping here so CI cannot start depending on
      # an apt package for its results.
      - name: Install (contracts only - must work with zero dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ./ml
          pip install "pytest>=8.4,<9.0"

      - name: ML tests without any OCR stack installed
        working-directory: ml
        run: pytest -q

      - name: Install the optional OCR extra
        run: pip install -e "./ml[ocr]"

      - name: ML tests with Pillow available
        working-directory: ml
        run: pytest -q

      # The product classifier is *run* with no dependencies - the shipped
      # artifact is JSON evaluated in plain Python, and the two steps above
      # already exercise it that way. scikit-learn is needed only to *train*
      # one, so it is installed last and separately: the tests it unlocks
      # check that a freshly trained artifact reproduces scikit-learn's own
      # probabilities and that the training command works end to end. They
      # skip, not fail, in the two runs above.
      - name: Install the optional classifier-training extra
        run: pip install -e "./ml[classify-train]"

      - name: ML tests with scikit-learn available
        working-directory: ml
        run: pytest -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in frontend/package.json.
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: it installs exactly the committed lockfile
      # and fails if package.json and the lockfile disagree, which is a real
      # error worth catching rather than silently resolving.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  container:
    name: Production image (Docker + Tesseract)
    runs-on: ubuntu-latest

    # This job exists for one thing the other three cannot check: that the
    # deployed image actually contains the Tesseract binary. `pip` cannot
    # install it, so a green `backend` job proves nothing about it - that suite
    # passes with the placeholder engine on a machine with no OCR stack at all.
    # An image without the binary builds fine, starts fine, reports itself as
    # running a real (non-placeholder) engine, and fails every single upload.
    #
    # No database and no running server here. Everything below is answerable
    # from the image itself, which keeps the job fast and leaves out the
    # container networking that would be the flakiest part of it.
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --tag legalmetrology-backend:ci .

      # The reason the Dockerfile exists at all.
      - name: Tesseract is installed in the image
        run: docker run --rm legalmetrology-backend:ci tesseract --version

      # collectstatic runs at build time, and CompressedManifestStaticFilesStorage
      # raises at request time when its manifest is absent - so an image missing
      # this fails on its first admin page rather than during the build.
      - name: Static files were collected into the image
        run: >-
          docker run --rm legalmetrology-backend:ci
          test -f /app/backend/staticfiles/staticfiles.json

      # The rule and framework files are read from disk by deploy_setup. An
      # image without them builds and starts, then fails initialisation.
      - name: Rule and framework files are present in the image
        run: >-
          docker run --rm legalmetrology-backend:ci
          test -f /app/rules/framework/applicability_conditions.json

      # The statement this job is really making: with the real OCR pipeline
      # selected, the image reports a pipeline that is NOT a placeholder AND is
      # available. Either half alone is not that claim - which is exactly the
      # distinction the health endpoint now reports.
      #
      # Touches no database. `default_pipeline_status` resolves the pipeline and
      # warms the engine, nothing more, so the throwaway values below are never
      # used to connect to anything; they exist because settings.py reads them
      # at import time and has no defaults for them.
      - name: The image can run the real OCR pipeline
        run: |
          docker run --rm \
            --env DJANGO_SECRET_KEY=ci-only-key-not-used-outside-this-runner \
            --env DJANGO_DEBUG=False \
            --env DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            --env DEFAULT_EXTRACTION_ENGINE_NAME=tesseract \
            --env DEFAULT_EXTRACTION_ENGINE_VERSION=0.3.0 \
            legalmetrology-backend:ci \
            python /app/backend/manage.py shell -c '
          from apps.extraction.services import extraction_service
          status = extraction_service.default_pipeline_status()
          print(status)
          assert status.is_available, "engine unavailable: " + status.detail
          assert status.is_placeholder is False, "a placeholder is configured"
          '
