[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelextract"
version = "0.1.0"
description = "Extraction contracts and OCR/ML interfaces for packaged-commodity label analysis."
requires-python = ">=3.11"
# Intentionally no runtime dependencies. This package currently defines
# interfaces and data contracts only. A concrete OCR engine declares its own
# dependencies when it is added - see ml/README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["labelextract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
